[build]
  publish = "frontend"
  # Genera frontend/env.js inyectando las Environment Variables de Netlify
  # (SUPABASE_URL, SUPABASE_KEY) hacia window.__ENV__. El archivo generado
  # esta en .gitignore y nunca toca el repo.
  command = "printf 'window.__ENV__ = { SUPABASE_URL: \"%s\", SUPABASE_KEY: \"%s\" };' \"$SUPABASE_URL\" \"$SUPABASE_KEY\" > frontend/env.js"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# NETLIFY: Site settings > Environment variables
#   SUPABASE_URL  = https://TU-PROYECTO.supabase.co
#   SUPABASE_KEY  = tu_key_publishable (rotada, nunca la historica expuesta)
# La tabla mediciones_aire NO se renombra.
# Para desarrollo local, copia frontend/config.example.js como frontend/env.js
# y llena tus valores (ese archivo esta en .gitignore).
